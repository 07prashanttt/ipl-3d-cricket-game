<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPL 3D Cricket Game</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#050914;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
header {
  padding:16px;
  text-align:center;
  background:#101a2b;
}
header h1 { color:#ffb52e; font-size:23px; }
#stadium { width:100vw; height:65vh; }
.info {
  text-align:center;
  padding:12px;
}
button {
  padding:13px 25px;
  border:0;
  border-radius:9px;
  background:#ff9d18;
  color:#111;
  font-size:16px;
  font-weight:bold;
  margin-top:12px;
}
</style>
</head>

<body>

<header>
<h1>🏏 IPL 3D CRICKET</h1>
<p>THE ULTIMATE CRICKET EXPERIENCE</p>
</header>

<div id="stadium"></div>

<div class="info">
<h2>WELCOME TO IPL</h2>
<p>3D Stadium • Cricket Ground • Floodlights</p>
<button onclick="alert('Auction Mode Coming Soon!')">
START GAME
</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const container = document.getElementById("stadium");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x071326);

const camera = new THREE.PerspectiveCamera(
60, container.clientWidth/container.clientHeight, 0.1, 1000
);

camera.position.set(0, 18, 25);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth,container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
container.appendChild(renderer.domElement);

// Stadium lights
scene.add(new THREE.AmbientLight(0xffffff,0.7));

const light = new THREE.DirectionalLight(0xffffff,1.5);
light.position.set(10,25,10);
scene.add(light);

// Ground
const ground = new THREE.Mesh(
new THREE.CircleGeometry(11,100),
new THREE.MeshStandardMaterial({color:0x167d35})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// Boundary line
const boundary = new THREE.Mesh(
new THREE.TorusGeometry(10.7,0.12,8,100),
new THREE.MeshBasicMaterial({color:0xffffff})
);
boundary.rotation.x = Math.PI/2;
boundary.position.y = 0.05;
scene.add(boundary);

// Stadium seating
for(let i=0;i<4;i++){
const stand = new THREE.Mesh(
new THREE.TorusGeometry(13+i*1.2,0.65,8,100),
new THREE.MeshStandardMaterial({
color:[0x263c70,0x8b263d,0x273b55,0x52627a][i]
})
);
stand.rotation.x = Math.PI/2;
stand.position.y = 1+i*0.6;
scene.add(stand);
}

// Cricket pitch
const pitch = new THREE.Mesh(
new THREE.BoxGeometry(2.5,0.15,7),
new THREE.MeshStandardMaterial({color:0xc6a879})
);
pitch.position.y=0.12;
scene.add(pitch);

// Pitch lines
for(let z of [-2.7,2.7]){
const line = new THREE.Mesh(
new THREE.BoxGeometry(3,0.03,0.12),
new THREE.MeshBasicMaterial({color:0xffffff})
);
line.position.set(0,0.22,z);
scene.add(line);
}

// Wickets
function makeWicket(z){
for(let x of [-0.35,0,0.35]){
const stump = new THREE.Mesh(
new THREE.CylinderGeometry(0.045,0.045,0.9,12),
new THREE.MeshStandardMaterial({color:0xffffff})
);
stump.position.set(x,0.65,z);
scene.add(stump);
}
}
makeWicket(-3.3);
makeWicket(3.3);

// Floodlight towers
for(let x of [-14,14]){
for(let z of [-12,12]){
const pole = new THREE.Mesh(
new THREE.CylinderGeometry(0.12,0.2,12,12),
new THREE.MeshStandardMaterial({color:0xaaaaaa})
);
pole.position.set(x,6,z);
scene.add(pole);

const lamp = new THREE.PointLight(0xffffff,3,30);
lamp.position.set(x,12,z);
scene.add(lamp);
}
}

// Camera animation
function animate(){
requestAnimationFrame(animate);
scene.rotation.y += 0.0008;
renderer.render(scene,camera);
}
animate();

// Responsive
window.addEventListener("resize",()=>{
camera.aspect=container.clientWidth/container.clientHeight;
camera.updateProjectionMatrix();
renderer.setSize(container.clientWidth,container.clientHeight);
});
</script>

</body>
</html>
